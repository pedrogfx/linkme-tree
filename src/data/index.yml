experience:
  - id: 1
    role: Data Engineer / Data Platform Engineer
    company: Grupo SBF
    period: Mar 2022 — Present
    description: Building and running the data platform that serves the whole group, from real-time ingestion to governed analytics.
    highlights:
      - Built batch and real-time pipelines with Python and Spark on GCP (BigQuery, Dataproc, Cloud Storage, Kubernetes).
      - Orchestrated ETL/ELT with Airflow on GKE and shipped Kafka/Confluent ingestion APIs with AVRO and full test coverage.
      - Led the SAP ingestion architecture with AecorSoft CDC and SAP DataSphere real-time streaming.
      - Automated infrastructure with Terraform, Helm and GitHub Actions; reduced BigQuery and GCS costs via slot reservations and monitoring.
    tags:
      - GCP
      - Airflow
      - Kafka
      - Terraform
      - SAP
  - id: 2
    role: Data Engineer
    company: RCI Analytics Consulting
    period: Oct 2019 — Mar 2022
    description: Consulting projects across retail and logistics, from source integration to decision-ready dashboards.
    highlights:
      - Built pipelines with SSIS, Pentaho, Python and Tableau Prep over REST APIs, FTP, Oracle, MSSQL, PostgreSQL, Redshift and S3.
      - Modeled star and snowflake data warehouses and delivered Power BI and Tableau dashboards.
      - Delivered analytics platforms for clients such as Usaflex (AWS data lake, DW and ODS) and Indigo (Azure + SSIS + Power BI).
    tags:
      - SSIS
      - Pentaho
      - Python
      - Redshift
      - Power BI
  - id: 3
    role: Data Auditing
    company: Grupo Oleoplan
    period: Jan 2019 — Oct 2019
    description: Fiscal and invoicing data auditing, with reporting to support the business.
    highlights:
      - Audited fiscal data and product invoicing, ensuring compliance with tax standards.
      - Built Power BI dashboards to monitor financial performance.
    tags:
      - SQL
      - Power BI

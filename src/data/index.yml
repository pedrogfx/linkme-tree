experience:
  - id: 1
    role: Senior Data Platform Engineer
    company: Arco Educação
    period: Sep 2026 — Present
    description: Senior data platform engineering for one of the largest education groups in Brazil — scalable batch and streaming data products.
    tags:
      - GCP
      - Kafka
      - Airflow
      - Kubernetes
      - Data Products
  - id: 2
    role: Data Platform Engineer
    company: Grupo SBF
    period: Mar 2022 — Sep 2026
    description: Large-scale data platform for one of the largest sports retailers in Latin America — batch and streaming, owned end to end.
    highlights:
      - Owned a platform with 1,000+ Airflow DAGs and 300+ Kafka streaming pipelines, processing tens of TB a day for 1,000+ internal users.
      - Led the SAP streaming integration with Kafka and SAP Datasphere, adding schema-change detection and proactive alerts for breaking changes.
      - Took part in the AWS-to-GCP migration, redesigning pipelines and decommissioning legacy systems.
      - Cut Kubernetes costs by ~23% and storage costs by 15% without touching SLAs.
      - Designed task-level SLA monitoring and dashboards, reducing delays through proactive alerting.
      - Built an AI-based solution to detect sensitive data, strengthening governance and security.
    tags:
      - GCP
      - Airflow
      - Kafka
      - Kubernetes
      - Terraform
      - SAP
      - FinOps
  - id: 3
    role: Data Engineer
    company: RCI Analytics Consulting
    period: Oct 2019 — Mar 2022
    description: Data platforms for retail, finance and logistics clients, from source integration to reliable analytics.
    highlights:
      - Built end-to-end pipelines integrating 10+ sources and processing ~5TB a day.
      - Reduced pipeline failures by 30% by optimizing SQL queries and API ingestion.
      - Modeled star and snowflake warehouses and delivered dashboards used by 300+ people.
    tags:
      - Python
      - SSIS
      - Pentaho
      - Redshift
      - Power BI
      - Tableau
  - id: 4
    role: Data Auditing
    company: Grupo Oleoplan
    period: Jan 2019 — Oct 2019
    description: Started my career with fiscal and invoice data for one of the largest biodiesel producers in Brazil.
    highlights:
      - Audited invoicing and sales data to support tax reporting and compliance.
      - Built Power BI dashboards to track financial KPIs and cut manual reporting.
    tags:
      - Power BI
      - Excel
      - Data Auditing
